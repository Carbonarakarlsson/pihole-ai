name: CI

on:
  push:
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Run ResourceWarning-sensitive tests
        run: python -W error::ResourceWarning -m unittest discover -s tests

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Audit package contents
        run: python scripts/package_audit.py dist/*

      - name: Smoke-test built wheel
        run: python scripts/smoke_wheel.py dist/*.whl

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pihole-ai-dist
          path: dist/*
